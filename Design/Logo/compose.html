<!doctype html>
<html><head><meta charset="utf-8">
<!-- CraDev intro logosi manbasi. Har bir qatlam alohida PNG qilib chiqariladi (render.js). -->
<style>
@font-face{font-family:Orbitron;font-weight:900;src:url(fonts/Orbitron-900.ttf)}
@font-face{font-family:Rajdhani;font-weight:600;src:url(fonts/Rajdhani-600.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:#05070d;position:relative}
body.transparent{background:transparent}
.layer{position:absolute;left:50%;transform:translateX(-50%)}
#emblem{top:250px;width:300px;height:300px}
#emblem svg{width:300px;height:300px;overflow:visible}
.word{top:552px;font-family:Orbitron;font-weight:900;font-size:112px;line-height:1;white-space:nowrap;letter-spacing:.02em}
.word .cra{color:#dfe7f5}
.word .dev{background:linear-gradient(100deg,#2ee6ff 0%,#4f8dff 55%,#9d5cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#wordglow{filter:blur(22px);opacity:.85}
#wordglow .cra{color:#3f9dff;background:none}
#wordglow .dev{background:linear-gradient(100deg,#2ee6ff,#9d5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#divider{top:700px;width:560px;height:14px;display:flex;align-items:center;justify-content:center}
#divider .line{position:absolute;left:0;right:0;top:6px;height:2px;background:linear-gradient(90deg,rgba(46,230,255,0) 0%,rgba(46,230,255,.9) 30%,rgba(157,92,255,.9) 70%,rgba(157,92,255,0) 100%)}
#divider .gem{width:9px;height:9px;transform:rotate(45deg);background:#dff6ff;box-shadow:0 0 10px 2px rgba(80,200,255,.9)}
#tagline{top:728px;font-family:Rajdhani;font-weight:600;font-size:28px;letter-spacing:.5em;color:#b4c6e4;white-space:nowrap;padding-left:.5em}
</style></head>
<body>
<div id="emblem" class="layer">
<svg viewBox="-64 -64 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6ff"/>
      <stop offset=".55" stop-color="#4f8dff"/>
      <stop offset="1" stop-color="#9d5cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- tashqi olti burchak -->
    <polygon points="256,20 460.4,138 460.4,374 256,492 51.6,374 51.6,138" fill="none" stroke="url(#g)" stroke-width="12" stroke-linejoin="round"/>
    <!-- ichki ingichka olti burchak -->
    <polygon points="256,46 437.9,151 437.9,361 256,466 74.1,361 74.1,151" fill="none" stroke="url(#g)" stroke-opacity=".35" stroke-width="3"/>
    <!-- "C" harfi: o'ng tomoni ochiq olti burchak -->
    <polyline points="377.2,186 256,116 134.8,186 134.8,326 256,396 377.2,326" fill="none" stroke="url(#g)" stroke-width="40" stroke-linejoin="miter" stroke-linecap="butt"/>
    <!-- "play" uchburchagi: o'yin belgisi -->
    <polygon points="222,198 222,314 324,256" fill="#eaf6ff" stroke="#eaf6ff" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
</div>
<div id="wordglow" class="layer word"><span class="cra">Cra</span><span class="dev">Dev</span></div>
<div id="wordmark" class="layer word"><span class="cra">Cra</span><span class="dev">Dev</span></div>
<div id="divider" class="layer"><div class="line"></div><div class="gem"></div></div>
<div id="tagline" class="layer">A NEW ERA OF GAMING</div>
</body></html>
