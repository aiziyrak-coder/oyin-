<!doctype html>
<html><head><meta charset="utf-8">
<!-- CDCGroup logosi manbasi (zamonaviy, tekis kumush). Qatlamlar build.sh orqali alohida PNG qilib chiqariladi. -->
<style>
@font-face{font-family:Manrope;font-weight:800;src:url(../fonts/Manrope-800.ttf)}
@font-face{font-family:Manrope;font-weight:500;src:url(../fonts/Manrope-500.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:#0b0b0c;position:relative}
body.transparent{background:transparent}
.layer{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
/* kumush: ochiqdan to'qroqqa yumshoq o'tish, yaltiroq xrom emas */
#cdc{top:392px;font-family:Manrope;font-weight:800;font-size:150px;line-height:1;letter-spacing:.04em;padding-left:.04em;
  background:linear-gradient(180deg,#eceef1 0%,#c9cdd3 55%,#a7acb3 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#line{top:563px;width:420px;height:3px;background:#b9bdc3}
#group{top:590px;font-family:Manrope;font-weight:500;font-size:30px;line-height:1;letter-spacing:.95em;padding-left:.95em;color:#9a9fa6}
</style></head>
<body>
<div id="cdc" class="layer">CDC</div>
<div id="line" class="layer"></div>
<div id="group" class="layer">GROUP</div>
</body></html>
