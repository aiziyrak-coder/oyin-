<!doctype html>
<html><head><meta charset="utf-8">
<!-- CraDev logosi manbasi (zamonaviy, tekis). Qatlamlar build.sh orqali alohida PNG qilib chiqariladi. -->
<style>
@font-face{font-family:Unbounded;font-weight:700;src:url(../fonts/Unbounded-700.ttf)}
@font-face{font-family:Manrope;font-weight:600;src:url(../fonts/Manrope-600.ttf)}
:root{--blue:#3d5afe;--white:#ffffff;--muted:#8e939a}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:#0b0b0c;position:relative}
body.transparent{background:transparent}
.lockup{position:absolute;left:50%;top:510px;transform:translate(-50%,-50%);display:flex;align-items:center;gap:36px}
.mark{position:relative;width:150px;height:150px}
.mark>*{position:absolute;inset:0}
.mark svg{width:150px;height:150px;display:block}
.word{font-family:Unbounded;font-weight:700;font-size:112px;line-height:1;letter-spacing:-.02em;color:var(--white);white-space:nowrap;padding-bottom:6px}
.word .dev{color:var(--blue)}
#tagline{position:absolute;left:50%;top:650px;transform:translateX(-50%);font-family:Manrope;font-weight:600;font-size:22px;
  letter-spacing:.5em;padding-left:.5em;color:var(--muted);white-space:nowrap}
</style></head>
<body>
<div class="lockup">
  <div class="mark">
    <!-- belgi foni: yumaloq burchakli kvadrat -->
    <div id="tile" class="layer"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#3d5afe"/></svg></div>
    <!-- belgi ichidagi oq "C" va "play" uchburchagi -->
    <div id="glyph" class="layer"><svg viewBox="0 0 100 100">
      <path d="M 68 32 A 26 26 0 1 0 68 68" fill="none" stroke="#fff" stroke-width="13"/>
      <polygon points="45,38 45,62 64,50" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    </svg></div>
  </div>
  <div id="wordmark" class="layer word">Cra<span class="dev">Dev</span></div>
</div>
<div id="tagline" class="layer">A NEW ERA OF GAMING</div>
</body></html>
