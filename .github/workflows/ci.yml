# CraDev CI: har bir push'da server testlari va serverni bitta .exe ga yig'ish, Unity'da o'yinni yig'ish
# (Windows va Linux) va Linux build'ni virtual ekranda ishga tushirib tekshirish (tools/ci/smoke.sh).
#
# Unity qismi uchun repo'da 3 ta secret kerak (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE  - C:\ProgramData\Unity\Unity_lic.ulf faylining to'liq matni
#   UNITY_EMAIL    - Unity akkaunti email'i
#   UNITY_PASSWORD - Unity akkaunti paroli
# Ular bo'lmasa Unity job'lari o'tkazib yuboriladi (ogohlantirish bilan).

name: CraDev CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'Design/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (testlar va .exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: Server
      - name: Serverni bitta faylga yig'ish (Node.js'siz ishlaydi)
        run: tools/ci/server-exe.sh dist
      - name: Yig'ilgan serverni tekshirish
        run: |
          PORT=18080 DB_PATH="$RUNNER_TEMP/check.db" dist/cradev-server > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          ok=1
          for _ in $(seq 1 30); do curl -sf http://localhost:18080/health && { ok=0; break; }; sleep 0.5; done
          kill "$pid"
          cat "$RUNNER_TEMP/server.log"
          exit "$ok"
      - uses: actions/upload-artifact@v6
        with:
          name: CraDevServer-Windows
          path: dist/CraDevServer.exe
          retention-days: 30

  license:
    name: Unity litsenziyasi
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Secret'lar bormi
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unity litsenziyasi yo'q::UNITY_LICENSE, UNITY_EMAIL va UNITY_PASSWORD secret'larini qo'shing (README: GitHub'da avtomatik yig'ish). Unity build o'tkazib yuborildi."
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [license, server]
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [StandaloneWindows64, StandaloneLinux64]
    steps:
      - name: Diskda joy ochish (Unity image ~6 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
      - name: Unity build
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildName: CraDev
          # Sahnalar repo'da yo'q: bu metod avval ularni yaratadi, keyin o'yinni yig'adi
          buildMethod: CraDev.EditorTools.CraDevBatch.BuildGame
          versioning: None
      # Windows o'yini yonida server va ikkalasini birga ochadigan Play.cmd
      - uses: actions/download-artifact@v7
        if: matrix.target == 'StandaloneWindows64'
        with:
          name: CraDevServer-Windows
          path: server-exe
      - name: Server'ni o'yin yoniga qo'yish
        if: matrix.target == 'StandaloneWindows64'
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cp server-exe/CraDevServer.exe tools/ci/Play.cmd build/StandaloneWindows64/
      - uses: actions/upload-artifact@v6
        with:
          name: CraDev-${{ matrix.target == 'StandaloneWindows64' && 'Windows' || 'Linux' }}
          path: |
            build/${{ matrix.target }}
            !build/${{ matrix.target }}/*DoNotShip*
          retention-days: 30

  smoke:
    name: O'yinni ishga tushirib tekshirish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: CraDev-Linux
          path: game
      - name: Paketlar (virtual ekran, OCR, video)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xdotool ffmpeg imagemagick tesseract-ocr libgl1-mesa-dri libglu1-mesa
      - name: Smoke test
        run: tools/ci/smoke.sh game smoke
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: CraDev-smoke
          path: |
            smoke
            !smoke/frames/*.png
          retention-days: 30
