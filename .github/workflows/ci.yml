# CraDev CI: har bir push'da server testlari va serverni bitta .exe ga yig'ish, Unity'siz taxminiy C#
# kompilyatsiya tekshiruvi (tools/ci/cs-check), Unity'da o'yinni yig'ish (Windows va Linux) va Linux build'ni
# virtual ekranda ishga tushirib tekshirish (tools/ci/smoke.sh).
#
# Unity qismi uchun repo'da 3 ta secret kerak (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE  - C:\ProgramData\Unity\Unity_lic.ulf faylining to'liq matni
#   UNITY_EMAIL    - Unity akkaunti email'i
#   UNITY_PASSWORD - Unity akkaunti paroli
# Ular bo'lmasa Unity build va smoke job'lari o'tkazib yuboriladi (ogohlantirish va run xulosasida yozuv bilan):
# unda yashil belgi faqat server testlari va taxminiy C# tekshiruvi o'tganini bildiradi.

name: CraDev CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'Design/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (testlar va .exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: Server
      - run: npm test
        working-directory: Server
      - name: Serverni bitta faylga yig'ish (Node.js'siz ishlaydi)
        run: tools/ci/server-exe.sh dist
      - name: Yig'ilgan serverni tekshirish
        run: |
          PORT=18080 DB_PATH="$RUNNER_TEMP/check.db" dist/cradev-server > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          ok=1
          for _ in $(seq 1 30); do curl -sf http://localhost:18080/health && { ok=0; break; }; sleep 0.5; done
          kill "$pid"
          cat "$RUNNER_TEMP/server.log"
          exit "$ok"
      - uses: actions/upload-artifact@v6
        with:
          name: CraDevServer-Windows
          path: |
            dist/CraDevServer.exe
            dist/NewWorld-Server-THIRD-PARTY-NOTICES.txt
          retention-days: 30

  # Unity'siz, litsenziyasiz: Unity 2021 modullari + stublar bilan kompilyatsiya (tools/ci/cs-check/README.md).
  # Haqiqiy Unity 6 build'ining o'rnini bosmaydi, lekin sintaksis va tur xatolarini har push'da ushlaydi.
  csharp:
    name: C# kompilyatsiya (taxminiy, Unity'siz)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ${{ runner.temp }}/cradev-cs-check-cache
          key: cs-check-${{ hashFiles('tools/ci/cs-check/**/*.csproj', 'tools/ci/cs-check/check.sh') }}
      - name: Kompilyatsiya
        env:
          CS_CHECK_CACHE: ${{ runner.temp }}/cradev-cs-check-cache
        run: |
          set -o pipefail
          tools/ci/cs-check/check.sh | tee "$RUNNER_TEMP/cs-check.log"
      - name: Xulosa
        if: always()
        run: |
          {
            echo "### C# kompilyatsiya (taxminiy)"
            echo "Unity 2021 modullari va stublar bilan; Unity 6 build'ining o'rnini bosmaydi."
            echo '```'
            tail -n 60 "$RUNNER_TEMP/cs-check.log" 2>/dev/null || echo "log yo'q"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  license:
    name: Unity litsenziyasi
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Secret'lar bormi
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unity litsenziyasi yo'q::UNITY_LICENSE, UNITY_EMAIL va UNITY_PASSWORD secret'larini qo'shing (README: GitHub'da avtomatik yig'ish). Unity build o'tkazib yuborildi."
            {
              echo "### Unity build va smoke test ISHLAMADI"
              echo "UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD secret'lari yo'q: o'yin Unity'da yig'ilmadi va ishga tushirib tekshirilmadi."
              echo "Yashil natija faqat server testlari va taxminiy C# kompilyatsiya tekshiruvi o'tganini bildiradi."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [license, server]
    if: needs.license.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [StandaloneWindows64, StandaloneLinux64]
    steps:
      - name: Diskda joy ochish (Unity image ~6 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
      - name: Unity build
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildName: CraDev
          # Sahnalar repo'da bor, lekin builder koddan qayta yaratadi: bu metod avval barcha 6 sahnani yaratadi,
          # keyin o'yinni yig'adi (grafika bo'lmasa yuz/kiyim xaritalari commit qilingan JSON'dan olinadi)
          buildMethod: CraDev.EditorTools.CraDevBatch.BuildGame
          versioning: None
      # Windows o'yini yonida server va ikkalasini birga ochadigan Play.cmd
      - uses: actions/download-artifact@v7
        if: matrix.target == 'StandaloneWindows64'
        with:
          name: CraDevServer-Windows
          path: server-exe
      - name: Server'ni o'yin yoniga qo'yish
        if: matrix.target == 'StandaloneWindows64'
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          cp server-exe/CraDevServer.exe server-exe/NewWorld-Server-THIRD-PARTY-NOTICES.txt tools/ci/Play.cmd build/StandaloneWindows64/
      - uses: actions/upload-artifact@v6
        with:
          name: CraDev-${{ matrix.target == 'StandaloneWindows64' && 'Windows' || 'Linux' }}
          path: |
            build/${{ matrix.target }}
            !build/${{ matrix.target }}/*DoNotShip*
          retention-days: 30

  smoke:
    name: O'yinni ishga tushirib tekshirish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: CraDev-Linux
          path: game
      - name: Paketlar (virtual ekran, OCR, video)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xdotool ffmpeg imagemagick tesseract-ocr libgl1-mesa-dri libglu1-mesa
      - name: Smoke test
        run: tools/ci/smoke.sh game smoke
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: CraDev-smoke
          path: |
            smoke
            !smoke/frames/*.png
          retention-days: 30
